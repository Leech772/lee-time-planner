<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Day1 综合挑战 · U1问候 + U2工作爱好</title>
<style>
  :root {
    --bg: #f4f1ea;
    --bg2: #e8eef6;
    --card: #ffffff;
    --card2: #f7f9fc;
    --accent: #3b82f6;
    --accent-soft: #dbeafe;
    --accent2: #2563eb;
    --good: #16a34a;
    --good-bg: #ecfdf5;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --speak: #7c3aed;
    --speak2: #6d28d9;
    --warn: #d97706;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #fde68a33 0%, transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 14px 48px; gap: 12px;
  }
  h1 {
    font-size: 1.12rem; margin: 6px 0 0; font-weight: 750;
    text-align: center; line-height: 1.4; color: #0f172a;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--muted); font-size: 0.82rem; margin: 0; text-align: center; }
  .voice-status {
    width: min(460px, 100%);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 6px;
  }
  .voice-status .line {
    font-size: 0.82rem; color: var(--text);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .voice-status .line b { color: var(--accent2); font-weight: 650; }
  .voice-status .tip {
    font-size: 0.75rem; color: var(--warn); line-height: 1.4; display: none;
  }
  .voice-status .tip.show { display: block; }
  .voice-status select {
    width: 100%; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--text); font-size: 0.82rem; outline: none;
  }
  .voice-status select:focus { border-color: var(--accent); }
  .tabs {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    width: min(460px, 100%);
  }
  .tabs button {
    border: 1px solid var(--border); border-radius: 999px; padding: 8px 13px;
    font-size: 0.82rem; cursor: pointer;
    background: #fff; color: var(--text);
    box-shadow: var(--shadow-sm);
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  .tabs button:active { transform: scale(.98); }
  .tabs button.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-weight: 650; box-shadow: 0 6px 16px rgba(59,130,246,.28);
  }
  .tabs button .n {
    display: inline-block; min-width: 1.2em; margin-left: 3px;
    font-size: 0.72rem; opacity: .9;
  }
  .progress {
    width: min(460px, 100%); height: 8px;
    background: #e2e8f0; border-radius: 99px; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(15,23,42,.06);
  }
  .progress > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, #60a5fa, #3b82f6 55%, #2563eb);
    width: 0%; transition: width .28s ease;
    border-radius: 99px;
  }
  .stats {
    width: min(460px, 100%);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.84rem; color: var(--muted); gap: 8px; flex-wrap: wrap;
  }
  .stats .score { color: var(--accent2); font-weight: 700; }
  .toolbar {
    width: min(460px, 100%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .toolbar button, .actions button, .speak-btn, .opt, .start-btn, .chip {
    border: none; border-radius: 12px; padding: 10px 14px;
    font-size: 0.9rem; cursor: pointer;
    background: #fff; color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .toolbar button.primary, .actions .primary, .start-btn, .actions .next {
    background: linear-gradient(180deg, #4f94ff, var(--accent));
    color: #fff; font-weight: 650; border-color: transparent;
    box-shadow: 0 6px 16px rgba(59,130,246,.28);
  }
  .toolbar button.ghost {
    background: #fff; border: 1px solid var(--border); color: var(--muted);
  }
  .card {
    width: min(460px, 100%);
    background: var(--card); border-radius: 20px;
    padding: 20px 16px 16px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(226,232,240,.9);
    display: flex; flex-direction: column; gap: 12px;
  }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-size: 0.7rem; padding: 3px 9px; border-radius: 99px;
    background: #f1f5f9; color: #475569; border: 1px solid var(--border);
  }
  .tag.type { background: var(--accent-soft); color: #1d4ed8; border-color: #bfdbfe; }
  .tag.diff-hard { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
  .tag.diff-mid { background: #f8fafc; color: #64748b; }
  .prompt {
    font-size: 1.06rem; line-height: 1.6; font-weight: 600;
    word-break: break-word; color: #0f172a;
  }
  .prompt .blank {
    display: inline-block; min-width: 2.2em; border-bottom: 2px solid var(--accent);
    color: var(--accent2); text-align: center; margin: 0 2px; padding: 0 4px;
  }
  .hint-zh { font-size: 0.85rem; color: var(--muted); line-height: 1.45; }
  .speak-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .speak-btn {
    background: linear-gradient(180deg, #8b5cf6, var(--speak));
    color: #fff; font-weight: 650; border-radius: 999px; padding: 8px 14px;
    border: none; box-shadow: 0 6px 14px rgba(124,58,237,.25);
  }
  .speak-btn.slow {
    background: linear-gradient(180deg, #7c3aed, var(--speak2));
  }
  .input-wrap input, .input-wrap textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--text); font-size: 1rem; outline: none;
    font-family: inherit;
  }
  .input-wrap input:focus, .input-wrap textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    text-align: left; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card2);
    line-height: 1.45; transition: border-color .15s, background .15s, box-shadow .15s;
    color: var(--text); box-shadow: none;
  }
  .opt:active { transform: scale(.99); }
  .opt.selected {
    border-color: var(--accent); background: #eff6ff;
    box-shadow: 0 0 0 3px rgba(59,130,246,.12);
  }
  .opt.correct { border-color: var(--good); background: var(--good-bg); color: #166534; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: #991b1b; }
  .opt:disabled { cursor: default; opacity: 1; }
  .reorder {
    display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px;
    padding: 10px; border-radius: 12px; border: 1px dashed #cbd5e1;
    background: var(--card2);
  }
  .reorder .chip, .pool .chip {
    background: #eff6ff; color: #1d4ed8; border-radius: 999px;
    padding: 8px 12px; font-size: 0.9rem; user-select: none;
    border: 1px solid #bfdbfe; box-shadow: none;
  }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; }
  .pool .chip { background: #fff; color: var(--text); border-color: var(--border); }
  .feedback {
    display: none; border-radius: 12px; padding: 12px 14px;
    font-size: 0.9rem; line-height: 1.55;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--good-bg); border: 1px solid #bbf7d0; color: #166534; }
  .feedback.no { background: var(--bad-bg); border: 1px solid #fecaca; color: #991b1b; }
  .feedback .en { color: #1d4ed8; font-weight: 650; margin-top: 6px; }
  .feedback .zh { color: #475569; margin-top: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: stretch; }
  .actions button { flex: 1; min-width: 110px; }
  .actions .skip {
    background: #fff; border: 1px solid var(--border); color: var(--muted);
  }
  .empty, .home {
    width: min(460px, 100%); text-align: center;
    background: var(--card); border-radius: 18px; padding: 28px 18px;
    box-shadow: var(--shadow);
  }
  .home h2 { margin: 0 0 8px; font-size: 1.15rem; }
  .home p { color: var(--muted); font-size: 0.88rem; line-height: 1.5; margin: 0 0 16px; }
  .home .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .home .start-btn { width: 100%; padding: 14px 10px; border-radius: 14px; }
  .home .start-btn small { display: block; font-weight: 400; opacity: .8; margin-top: 4px; font-size: 0.75rem; }
  .done-box {
    width: min(460px, 100%); background: var(--card); border-radius: 20px;
    padding: 26px 18px; text-align: center; display: none;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .done-box.show { display: block; }
  .done-box h2 { margin: 0 0 8px; color: #0f172a; }
  .done-box .big { font-size: 2.1rem; color: var(--accent2); font-weight: 800; margin: 8px 0; }
  .wrong-list { text-align: left; max-height: 280px; overflow: auto; margin-top: 12px; }
  .wrong-item {
    padding: 10px 12px; border-radius: 10px; background: var(--card2);
    margin-bottom: 8px; font-size: 0.85rem; line-height: 1.45;
    border: 1px solid var(--border);
  }
  .wrong-item .q { color: #334155; }
  .wrong-item .a { color: var(--good); margin-top: 4px; }
  .hidden { display: none !important; }
  .multi-blanks { display: flex; flex-direction: column; gap: 8px; }
  .multi-blanks label { font-size: 0.8rem; color: var(--muted); }
  .multi-blanks .row { display: flex; align-items: center; gap: 8px; }
  .multi-blanks .row span { min-width: 1.5em; color: var(--accent2); font-weight: 700; }
  .multi-blanks input {
    flex: 1; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--text); font-size: 0.95rem;
  }
  .multi-blanks input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
</style>
</head>
<body>
  <h1>Day1 综合挑战 · U1问候 + U2工作爱好</h1>
  <p class="sub">《英语1B基础模块（第三版）》· 中职 · 难度加强版</p>
  <div class="voice-status" id="voiceStatus">
    <div class="line">🔊 当前朗读：<b id="voiceName">检测中…</b> <span id="voiceTag">（英式）</span></div>
    <select id="voiceSelect" aria-label="选择朗读声音"></select>
    <div class="tip" id="voiceTip">未检测到英式女声。请用 Chrome，或在系统设置中安装「英语（英国）」语音包。</div>
  </div>


  <div class="tabs" id="tabs">
    <button data-mode="grammar" class="active">语法挑战<span class="n" id="n-grammar"></span></button>
    <button data-mode="dialogue">对话补全<span class="n" id="n-dialogue"></span></button>
    <button data-mode="mixed">综合扩展<span class="n" id="n-mixed"></span></button>
    <button data-mode="wrong">错题本<span class="n" id="n-wrong">0</span></button>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div class="stats">
    <span><span id="idx">0</span> / <span id="total">0</span></span>
    <span class="score">正确 <span id="correct">0</span> · 错误 <span id="wrongN">0</span></span>
  </div>
  <div class="toolbar">
    <button type="button" id="btnShuffle" class="ghost">🔀 打乱</button>
    <button type="button" id="btnRestart" class="ghost">↺ 重开本模式</button>
    <button type="button" id="btnClearWrong" class="ghost hidden">🗑 清空错题</button>
  </div>

  <div class="card" id="card">
    <div class="meta">
      <span class="tag" id="unitTag">U1</span>
      <span class="tag type" id="typeTag">填空</span>
      <span class="tag" id="diffTag">中等</span>
    </div>
    <div class="prompt" id="prompt">加载中…</div>
    <div class="hint-zh" id="hintZh"></div>
    <div class="speak-row" id="speakRow">
      <button type="button" class="speak-btn" id="speak">🔊 朗读英文</button>
      <button type="button" class="speak-btn slow" id="speakSlow">🐢 慢速</button>
    </div>
    <div id="answerArea"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions" id="actions">
      <button type="button" class="primary" id="btnCheck">检查答案</button>
      <button type="button" class="skip" id="btnSkip">跳过</button>
      <button type="button" class="next hidden" id="btnNext">下一题 →</button>
    </div>
  </div>

  <div class="done-box" id="done">
    <h2>本模式完成 🎉</h2>
    <div class="big" id="doneScore">0%</div>
    <p class="sub" id="doneMsg"></p>
    <div class="toolbar" style="margin-top:14px;justify-content:center">
      <button type="button" class="primary" id="btnAgain">再做一轮</button>
      <button type="button" class="ghost" id="btnRedoWrong">只做错题</button>
    </div>
  </div>

<script>
/* ========== Question bank ========== */
/** @typedef {{id:string, mode:string, unit:string, type:string, diff:string, prompt:string, hint?:string, speak?:string, options?:string[], answer:string|string[], accept?:string[], blanks?:number, blankLabels?:string[], parts?:string[], explain:string, explainEn:string, explainZh:string}} Q */

const BANK = [
  /* ===== 语法挑战：be ===== */
  {
    id:"g01", mode:"grammar", unit:"U1", type:"choose", diff:"中等",
    prompt:"选正确形式：_____ Samuel Anderson. Nice to meet you!",
    speak:"I am Samuel Anderson. Nice to meet you!",
    options:["I am","I is","I are","Me am"],
    answer:"I am",
    explain:"第一人称单数用 am。",
    explainEn:"I am Samuel Anderson. Nice to meet you!",
    explainZh:"我是塞缪尔·安德森。很高兴见到你！"
  },
  {
    id:"g02", mode:"grammar", unit:"U1", type:"choose", diff:"中等",
    prompt:"选正确形式：She _____ from Britain.",
    speak:"She is from Britain.",
    options:["am","is","are","be"],
    answer:"is",
    explain:"第三人称单数 she/he/it 用 is。",
    explainEn:"She is from Britain.",
    explainZh:"她来自英国。"
  },
  {
    id:"g03", mode:"grammar", unit:"U1", type:"fill", diff:"较难",
    prompt:"填空（缩写）：_____ from New York.（I am 的缩写）",
    hint:"提示：I'm / You're / He's…",
    speak:"I'm from New York.",
    answer:"I'm",
    accept:["I'm","I’m","I am"],
    explain:"I am 常缩写为 I'm。口语里很常见。",
    explainEn:"I'm from New York.",
    explainZh:"我来自纽约。"
  },
  {
    id:"g04", mode:"grammar", unit:"U1", type:"rewrite", diff:"较难",
    prompt:"改成否定句：They are classmates.",
    hint:"可用 aren't 或 are not",
    speak:"They aren't classmates.",
    answer:"They aren't classmates.",
    accept:["They aren't classmates.","They aren’t classmates.","They are not classmates.","They're not classmates.","They’re not classmates."],
    explain:"are 的否定：are not = aren't。",
    explainEn:"They aren't classmates. / They are not classmates.",
    explainZh:"他们不是同班同学。"
  },
  {
    id:"g05", mode:"grammar", unit:"U1", type:"rewrite", diff:"较难",
    prompt:"改成一般疑问句：He is a tour guide.",
    hint:"把 be 提前到句首",
    speak:"Is he a tour guide?",
    answer:"Is he a tour guide?",
    accept:["Is he a tour guide?","Is he a tour guide"],
    explain:"be 动词疑问句：把 is/am/are 提到主语前。",
    explainEn:"Is he a tour guide?",
    explainZh:"他是导游吗？"
  },
  {
    id:"g06", mode:"grammar", unit:"U1", type:"fill", diff:"较难",
    prompt:"简短回答：— Are you from the US? — Yes, _____.",
    speak:"Yes, I am.",
    answer:"I am",
    accept:["I am","I'm","I’m"],
    explain:"肯定简答用 Yes, I am.（不用 Yes, I'm. 单独作答时通常不缩写）",
    explainEn:"Yes, I am.",
    explainZh:"是的，我是。"
  },
  {
    id:"g07", mode:"grammar", unit:"U1", type:"choose", diff:"较难",
    prompt:"选正确简答：— Is she a receptionist? — No, _____.",
    speak:"No, she isn't.",
    options:["she isn't","she aren't","she doesn't","she not"],
    answer:"she isn't",
    explain:"对 is 提问用 isn't 否定；don't/doesn't 是一般现在时助动词，这里不配。",
    explainEn:"No, she isn't.",
    explainZh:"不，她不是。"
  },
  {
    id:"g08", mode:"grammar", unit:"U1", type:"error", diff:"较难",
    prompt:"改错（写出正确整句）：We is glad to meet you.",
    speak:"We are glad to meet you.",
    answer:"We are glad to meet you.",
    accept:["We are glad to meet you.","We're glad to meet you.","We’re glad to meet you."],
    explain:"we 搭配 are，不是 is。陷阱：第三人称单数才用 is。",
    explainEn:"We are glad to meet you.",
    explainZh:"我们很高兴见到你。"
  },
  {
    id:"g09", mode:"grammar", unit:"U1", type:"choose", diff:"中等",
    prompt:"选正确缩写：They _____ students.（= they are）",
    speak:"They're students.",
    options:["they're","they's","them're","their"],
    answer:"they're",
    explain:"they are → they're。their 是「他们的」，词性不同。",
    explainEn:"They're students.",
    explainZh:"他们是学生。"
  },
  {
    id:"g10", mode:"grammar", unit:"U1", type:"fill", diff:"较难",
    prompt:"填空：_____ you and your friend from Liverpool?",
    speak:"Are you and your friend from Liverpool?",
    answer:"Are",
    accept:["Are","are"],
    explain:"主语 you and your friend 是复数概念，用 Are。",
    explainEn:"Are you and your friend from Liverpool?",
    explainZh:"你和你的朋友来自利物浦吗？"
  },

  /* ===== 语法挑战：一般现在时 ===== */
  {
    id:"g11", mode:"grammar", unit:"U2", type:"choose", diff:"较难",
    prompt:"选正确形式：He _____ swimming every weekend.",
    speak:"He likes swimming every weekend.",
    options:["like","likes","liking","liked"],
    answer:"likes",
    explain:"第三人称单数 he/she/it 动词加 -s：like → likes。",
    explainEn:"He likes swimming every weekend.",
    explainZh:"他每个周末都喜欢游泳。"
  },
  {
    id:"g12", mode:"grammar", unit:"U2", type:"choose", diff:"较难",
    prompt:"陷阱题：She _____ English at a vocational school.",
    speak:"She studies English at a vocational school.",
    options:["study","studys","studies","studyies"],
    answer:"studies",
    explain:"以辅音+y 结尾：变 y 为 i 再加 -es → studies。不是 studys！",
    explainEn:"She studies English at a vocational school.",
    explainZh:"她在一所职业学校学英语。"
  },
  {
    id:"g13", mode:"grammar", unit:"U2", type:"choose", diff:"较难",
    prompt:"选正确否定：He _____ like stressful jobs.",
    speak:"He doesn't like stressful jobs.",
    options:["don't","doesn't","isn't","aren't"],
    answer:"doesn't",
    explain:"第三人称单数否定用 doesn't + 动词原形。don't 用于 I/you/we/they。",
    explainEn:"He doesn't like stressful jobs.",
    explainZh:"他不喜欢压力大的工作。"
  },
  {
    id:"g14", mode:"grammar", unit:"U2", type:"error", diff:"较难",
    prompt:"改错：She doesn't likes playing the piano.",
    speak:"She doesn't like playing the piano.",
    answer:"She doesn't like playing the piano.",
    accept:["She doesn't like playing the piano.","She does not like playing the piano."],
    explain:"doesn't 后面必须用动词原形 like，不能再加 -s。",
    explainEn:"She doesn't like playing the piano.",
    explainZh:"她不喜欢弹钢琴。"
  },
  {
    id:"g15", mode:"grammar", unit:"U2", type:"choose", diff:"较难",
    prompt:"选正确疑问助动词：_____ he work in a travel agency?",
    speak:"Does he work in a travel agency?",
    options:["Do","Does","Is","Are"],
    answer:"Does",
    explain:"第三人称单数疑问用 Does；后面动词用原形 work。",
    explainEn:"Does he work in a travel agency?",
    explainZh:"他在旅行社工作吗？"
  },
  {
    id:"g16", mode:"grammar", unit:"U2", type:"fill", diff:"较难",
    prompt:"简短回答：— Does she collect stamps? — No, she _____.",
    speak:"No, she doesn't.",

/* ========== State ========== */
const LS_KEY = "english1b_day1_wrong_v1";
let mode = "grammar";
let queue = [];
let qi = 0;
let correct = 0;
let wrong = 0;
let answered = false;
let selectedOpt = null;
let reorderPicked = [];
let enVoice = null;
let voiceMeta = { label: "检测中…", isUK: false, isFemale: false, tier: "none" };
let sessionWrongIds = new Set();

const $ = (id) => document.getElementById(id);

function loadWrongBook() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveWrongBook(arr) {
  localStorage.setItem(LS_KEY, JSON.stringify(arr));
  updateTabCounts();
}
function addWrong(q) {
  const book = loadWrongBook();
  if (!book.find(x => x.id === q.id)) {
    book.push({ id: q.id, prompt: q.prompt, answer: Array.isArray(q.answer) ? q.answer.join(" / ") : q.answer, explainEn: q.explainEn, explainZh: q.explainZh, ts: Date.now() });
    saveWrongBook(book);
  }
  sessionWrongIds.add(q.id);
}
function removeWrong(id) {
  saveWrongBook(loadWrongBook().filter(x => x.id !== id));
}
function updateTabCounts() {
  const c = (m) => BANK.filter(q => q.mode === m).length;
  $("n-grammar").textContent = c("grammar");
  $("n-dialogue").textContent = c("dialogue");
  $("n-mixed").textContent = c("mixed");
  $("n-wrong").textContent = loadWrongBook().length;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function isFemaleName(name) {
  return /female|woman|girl|emma|serena|kate|karen|susan|zira|hazel|martha|moira|fiona|tessa|victoria|aria|jenny|salli|ivy|joanna|kendra|kimberly|salli|amy|libby|sonia|anya|natalie|google uk english female/i.test(name)
    && !/male|david|daniel|thomas|fred|alex(?!a)|arthur|george|oliver|rishi|ryan|mark|james/i.test(name);
}
function isMaleName(name) {
  return /male|david|daniel|thomas|fred|arthur|george|oliver|rishi|ryan|mark|james|google uk english male/i.test(name);
}
function scoreVoice(v) {
  const lang = (v.lang || "").toLowerCase();
  const name = v.name || "";
  let score = 0;
  const isGB = /en(-|_)gb/.test(lang) || /uk english|british/i.test(name);
  const isUS = /en(-|_)us/.test(lang);
  const isEN = /^en/.test(lang);
  const female = isFemaleName(name);
  const male = isMaleName(name);
  // Prefer exact known UK female voices
  if (/google uk english female/i.test(name)) score += 1000;
  if (isGB && female) score += 800;
  if (isGB && !male) score += 500;
  if (isGB) score += 300;
  if (/emma|serena|kate|libby|sonia|hazel|martha|moira|fiona|tessa/i.test(name) && isGB) score += 120;
  if (!isGB && female && isUS) score += 180;
  if (!isGB && female && isEN) score += 120;
  if (isUS && !male) score += 60;
  if (isEN) score += 20;
  // Penalize known US-only / male
  if (/samantha/i.test(name)) score -= 80;
  if (male) score -= 200;
  if (!isEN) score -= 500;
  return score;
}
function pickBestVoice(preferredName) {
  if (!window.speechSynthesis) {
    enVoice = null;
    voiceMeta = { label: "不支持朗读", isUK: false, isFemale: false, tier: "none" };
    return;
  }
  const voices = speechSynthesis.getVoices() || [];
  const enVoices = voices.filter(v => /^en/i.test(v.lang || ""));
  let chosen = null;
  if (preferredName) {
    chosen = enVoices.find(v => v.name === preferredName) || voices.find(v => v.name === preferredName) || null;
  }
  if (!chosen && enVoices.length) {
    chosen = enVoices.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];
  }
  enVoice = chosen;
  if (!chosen) {
    voiceMeta = { label: "未找到英语语音", isUK: false, isFemale: false, tier: "none" };
    return;
  }
  const lang = (chosen.lang || "").toLowerCase();
  const name = chosen.name || "";
  const isUK = /en(-|_)gb/.test(lang) || /uk english|british/i.test(name);
  const female = isFemaleName(name) || (!isMaleName(name) && isUK);
  let tier = "fallback";
  if (isUK && female) tier = "uk-female";
  else if (isUK) tier = "uk";
  else if (female) tier = "us-female";
  voiceMeta = { label: name, isUK, isFemale: !!female, tier };
}
function refreshVoiceUI() {
  const nameEl = $("voiceName");
  const tagEl = $("voiceTag");
  const tipEl = $("voiceTip");
  const sel = $("voiceSelect");
  if (!nameEl) return;
  nameEl.textContent = voiceMeta.label || "未知";
  if (voiceMeta.tier === "uk-female") tagEl.textContent = "（英式女声）";
  else if (voiceMeta.tier === "uk") tagEl.textContent = "（英式）";
  else if (voiceMeta.tier === "us-female") tagEl.textContent = "（美式女声·后备）";
  else if (voiceMeta.tier === "fallback") tagEl.textContent = "（后备）";
  else tagEl.textContent = "";
  const needTip = voiceMeta.tier !== "uk-female";
  tipEl.classList.toggle("show", needTip);
  if (needTip && voiceMeta.tier === "none") {
    tipEl.textContent = "未检测到可用英语语音。请用 Chrome，或在系统设置中安装「英语（英国）」语音包。";
  } else if (needTip) {
    tipEl.textContent = "未检测到英式女声，已用后备音色。请用 Chrome，或在系统安装英式语音包以获得最佳效果。";
  }
  if (sel && !sel.dataset.filled) {
    const voices = (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang || ""));
    voices.sort((a, b) => scoreVoice(b) - scoreVoice(a));
    sel.innerHTML = "";
    if (!voices.length) {
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "无可用英语语音";
      sel.appendChild(opt);
    } else {
      voices.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        const uk = /en(-|_)gb/i.test(v.lang) || /uk english|british/i.test(v.name);
        const mark = uk ? "🇬🇧" : (/en(-|_)us/i.test(v.lang) ? "🇺🇸" : "🌐");
        opt.textContent = mark + " " + v.name + " (" + v.lang + ")";
        sel.appendChild(opt);
      });
    }
    sel.dataset.filled = "1";
  }
  if (sel && enVoice) sel.value = enVoice.name;
}
function initVoices() {
  pickBestVoice();
  // allow re-fill when voices arrive asynchronously
  const sel = $("voiceSelect");
  if (sel) sel.dataset.filled = "";
  refreshVoiceUI();
}
initVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = initVoices;
}
if ($("voiceSelect")) {
  $("voiceSelect").onchange = () => {
    pickBestVoice($("voiceSelect").value);
    refreshVoiceUI();
  };
}

function speakText(text, rate) {
  if (!text || !window.speechSynthesis) {
    alert("当前浏览器不支持朗读，请用 Chrome / Edge 打开。");
    return;
  }
  if (!enVoice) initVoices();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  u.rate = rate || 0.93;
  u.pitch = 1.05;
  if (enVoice) u.voice = enVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function typeLabel(t) {
  return ({ choose:"选择", fill:"填空", rewrite:"改写", error:"改错", translate:"翻译", multi:"多空填空", reorder:"排序" })[t] || t;
}
function norm(s) {
  return String(s || "")
    .trim()
    .replace(/[’‘]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/\s+/g, " ")
    .replace(/[.?!。？！]+$/g, "")
    .toLowerCase();
}
function matchOne(user, answer, accept) {
  const u = norm(user);
  const cands = [answer].concat(accept || []).map(norm);
  return cands.some(c => c === u);
}
function matchMulti(users, answers, acceptLists) {
  if (users.length !== answers.length) return false;
  return answers.every((a, i) => matchOne(users[i], a, (acceptLists && acceptLists[i]) || []));
}

function buildQueue(m, onlyIds) {
  let list;
  if (m === "wrong") {
    const book = loadWrongBook();
    const ids = onlyIds || book.map(x => x.id);
    list = BANK.filter(q => ids.includes(q.id));
  } else {
    list = BANK.filter(q => q.mode === m);
    if (onlyIds) list = list.filter(q => onlyIds.includes(q.id));
  }
  return shuffle(list.slice());
}

function startMode(m, onlyIds) {
  mode = m;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
  $("btnClearWrong").classList.toggle("hidden", m !== "wrong");
  queue = buildQueue(m, onlyIds);
  qi = 0; correct = 0; wrong = 0; answered = false; sessionWrongIds = new Set();
  $("done").classList.remove("show");
  $("card").classList.remove("hidden");
  if (!queue.length) {
    $("card").classList.add("hidden");
    $("done").classList.add("show");
    $("doneScore").textContent = "—";
    $("doneMsg").textContent = m === "wrong" ? "错题本是空的，先去做题吧！" : "本模式暂无题目。";
    updateStats();
    return;
  }
  render();
}

function updateStats() {
  $("idx").textContent = queue.length ? Math.min(qi + 1, queue.length) : 0;
  $("total").textContent = queue.length;
  $("correct").textContent = correct;
  $("wrongN").textContent = wrong;
  const pct = queue.length ? (qi / queue.length * 100) : 0;
  $("bar").style.width = Math.min(100, pct) + "%";
}

function renderPrompt(q) {
  return q.prompt.replace(/\\n/g, "<br/>");
}

function renderAnswerArea(q) {
  const area = $("answerArea");
  area.innerHTML = "";
  selectedOpt = null;
  reorderPicked = [];

  if (q.type === "choose") {
    const wrap = document.createElement("div");
    wrap.className = "opts";
    const opts = shuffle(q.options.slice());
    opts.forEach(opt => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt";
      btn.textContent = opt;
      btn.onclick = () => {
        if (answered) return;
        selectedOpt = opt;
        wrap.querySelectorAll(".opt").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      };
      wrap.appendChild(btn);
    });
    area.appendChild(wrap);
  } else if (q.type === "multi") {
    const wrap = document.createElement("div");
    wrap.className = "multi-blanks";
    for (let i = 0; i < q.blanks; i++) {
      const row = document.createElement("div");
      row.className = "row";
      const lab = document.createElement("span");
      lab.textContent = (q.blankLabels && q.blankLabels[i]) || (i + 1);
      const inp = document.createElement("input");
      inp.type = "text";
      inp.autocomplete = "off";
      inp.placeholder = "填空 " + (i + 1);
      inp.dataset.i = i;
      row.appendChild(lab);
      row.appendChild(inp);
      wrap.appendChild(row);
    }
    area.appendChild(wrap);
  } else if (q.type === "reorder") {
    const slot = document.createElement("div");
    slot.className = "reorder";
    slot.id = "reorderSlot";
    const pool = document.createElement("div");
    pool.className = "pool";
    pool.id = "reorderPool";
    const parts = shuffle(q.parts.slice());
    parts.forEach(p => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = p;
      chip.onclick = () => {
        if (answered) return;
        reorderPicked.push(p);
        chip.remove();
        const c2 = document.createElement("button");
        c2.type = "button";
        c2.className = "chip";
        c2.textContent = p;
        c2.onclick = () => {
          if (answered) return;
          const ix = reorderPicked.indexOf(p);
          if (ix >= 0) reorderPicked.splice(ix, 1);
          c2.remove();
          pool.appendChild(chip);
        };
        slot.appendChild(c2);
      };
      pool.appendChild(chip);
    });
    const tip = document.createElement("div");
    tip.className = "hint-zh";
    tip.textContent = "先点下方短语按正确顺序加入上方；点上方可撤回。";
    area.appendChild(tip);
    area.appendChild(slot);
    area.appendChild(pool);
  } else {
    const wrap = document.createElement("div");
    wrap.className = "input-wrap";
    const isLong = q.type === "rewrite" || q.type === "error" || q.type === "translate";
    const inp = document.createElement(isLong ? "textarea" : "input");
    if (!isLong) { inp.type = "text"; inp.autocomplete = "off"; }
    inp.id = "userAns";
    inp.placeholder = q.type === "translate" ? "写出英文句子…" : (q.type === "rewrite" || q.type === "error" ? "写出正确整句…" : "填入答案…");
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey && q.type !== "translate" && q.type !== "rewrite" && q.type !== "error") {
        e.preventDefault();
        checkAnswer();
      }
    });
    wrap.appendChild(inp);
    area.appendChild(wrap);
  }
}

function render() {
  if (qi >= queue.length) {
    showDone();
    return;
  }
  answered = false;
  const q = queue[qi];
  $("done").classList.remove("show");
  $("card").classList.remove("hidden");
  $("unitTag").textContent = q.unit;
  $("typeTag").textContent = typeLabel(q.type);
  $("diffTag").textContent = q.diff;
  $("diffTag").className = "tag " + (q.diff === "较难" ? "diff-hard" : "diff-mid");
  $("prompt").innerHTML = renderPrompt(q);
  $("hintZh").textContent = q.hint || "";
  $("feedback").className = "feedback";
  $("feedback").textContent = "";
  $("btnCheck").classList.remove("hidden");
  $("btnSkip").classList.remove("hidden");
  $("btnNext").classList.add("hidden");
  renderAnswerArea(q);
  updateStats();
  const firstInput = $("answerArea").querySelector("input, textarea");
  if (firstInput) setTimeout(() => firstInput.focus(), 50);
}

function getUserAnswer(q) {
  if (q.type === "choose") return selectedOpt;
  if (q.type === "multi") {
    return [...$("answerArea").querySelectorAll("input")].map(i => i.value);
  }
  if (q.type === "reorder") return reorderPicked.slice();
  const el = $("userAns");
  return el ? el.value : "";
}

function isCorrect(q, user) {
  if (q.type === "choose") return user === q.answer;
  if (q.type === "multi") return matchMulti(user, q.answer, q.accept);
  if (q.type === "reorder") {
    if (!Array.isArray(user) || user.length !== q.answer.length) return false;
    return user.every((p, i) => p === q.answer[i]);
  }
  return matchOne(user, q.answer, q.accept);
}

function lockChoices(q, ok, user) {
  if (q.type !== "choose") return;
  $("answerArea").querySelectorAll(".opt").forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === q.answer) btn.classList.add("correct");
    if (!ok && btn.textContent === user) btn.classList.add("wrong");
  });
}

function showFeedback(q, ok) {
  const fb = $("feedback");
  fb.className = "feedback show " + (ok ? "ok" : "no");
  const ansText = Array.isArray(q.answer) ? q.answer.join("  /  ") : q.answer;
  fb.innerHTML =
    (ok ? "✅ 正确！" : "❌ 不对。") +
    "<div style='margin-top:6px'>" + q.explain + "</div>" +
    "<div class='en'>🇬🇧 " + escapeHtml(q.explainEn) + "</div>" +
    "<div class='zh'>🇨🇳 " + escapeHtml(q.explainZh) + "</div>" +
    (ok ? "" : "<div style='margin-top:6px;color:#fca5a5'>参考答案：<b>" + escapeHtml(ansText) + "</b></div>");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function checkAnswer() {
  if (answered || qi >= queue.length) return;
  const q = queue[qi];
  const user = getUserAnswer(q);
  if (q.type === "choose" && user == null) { alert("请先选择一个选项"); return; }
  if (q.type === "multi" && user.some(u => !String(u).trim())) { alert("请填完所有空"); return; }
  if (q.type === "reorder" && user.length !== q.answer.length) { alert("请把所有短语排入顺序"); return; }
  if ((q.type === "fill" || q.type === "rewrite" || q.type === "error" || q.type === "translate") && !String(user).trim()) {
    alert("请先输入答案"); return;
  }

  const ok = isCorrect(q, user);
  answered = true;
  if (ok) {
    correct++;
    if (mode === "wrong") removeWrong(q.id);
  } else {
    wrong++;
    addWrong(q);
  }
  lockChoices(q, ok, user);
  showFeedback(q, ok);
  $("btnCheck").classList.add("hidden");
  $("btnSkip").classList.add("hidden");
  $("btnNext").classList.remove("hidden");
  updateStats();
}

function skipQ() {
  if (answered || qi >= queue.length) return;
  const q = queue[qi];
  answered = true;
  wrong++;
  addWrong(q);
  showFeedback(q, false);
  lockChoices(q, false, null);
  $("btnCheck").classList.add("hidden");
  $("btnSkip").classList.add("hidden");
  $("btnNext").classList.remove("hidden");
  updateStats();
}

function nextQ() {
  qi++;
  render();
}

function showDone() {
  $("card").classList.add("hidden");
  $("done").classList.add("show");
  const total = correct + wrong;
  const pct = total ? Math.round(correct / total * 100) : 0;
  $("doneScore").textContent = pct + "%";
  $("doneMsg").textContent = `正确 ${correct} · 错误 ${wrong} · 共 ${total} 题。错题已自动收入错题本。`;
  $("bar").style.width = "100%";
  updateTabCounts();
}

/* events */
document.querySelectorAll(".tabs button").forEach(btn => {
  btn.onclick = () => startMode(btn.dataset.mode);
});
$("btnCheck").onclick = checkAnswer;
$("btnSkip").onclick = skipQ;
$("btnNext").onclick = nextQ;
$("btnShuffle").onclick = () => startMode(mode);
$("btnRestart").onclick = () => startMode(mode);
$("btnAgain").onclick = () => startMode(mode);
$("btnRedoWrong").onclick = () => {
  const ids = [...sessionWrongIds];
  if (!ids.length) {
    startMode("wrong");
    return;
  }
  startMode("wrong", ids);
};
$("btnClearWrong").onclick = () => {
  if (confirm("确定清空错题本？")) {
    saveWrongBook([]);
    startMode("wrong");
  }
};
$("speak").onclick = () => {
  if (qi < queue.length) speakText(queue[qi].speak || queue[qi].explainEn, 0.92);
};
$("speakSlow").onclick = () => {
  if (qi < queue.length) speakText(queue[qi].speak || queue[qi].explainEn, 0.65);
};

updateTabCounts();
startMode("grammar");
</script>
</body>
