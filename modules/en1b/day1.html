<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Day1 · U1问候 + U2工作爱好</title>
<style>
  :root {
    --bg: #f4f1ea;
    --bg2: #e8eef6;
    --card: #ffffff;
    --card2: #f7f9fc;
    --accent: #3b82f6;
    --accent-soft: #dbeafe;
    --accent2: #2563eb;
    --good: #16a34a;
    --good-bg: #ecfdf5;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --speak: #7c3aed;
    --speak2: #6d28d9;
    --warn: #d97706;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #fde68a33 0%, transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 14px 48px; gap: 12px;
  }
  h1 {
    font-size: 1.12rem; margin: 6px 0 0; font-weight: 750;
    text-align: center; line-height: 1.4; color: #0f172a;
  }
  .sub { color: var(--muted); font-size: 0.82rem; margin: 0; text-align: center; }
  .voice-status {
    width: min(460px, 100%);
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 6px;
  }
  .voice-status .line {
    font-size: 0.82rem; color: var(--text);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .voice-status .line b { color: var(--accent2); font-weight: 650; }
  .voice-status .tip { font-size: 0.75rem; color: var(--warn); line-height: 1.4; display: none; }
  .voice-status .tip.show { display: block; }
  .voice-status select {
    width: 100%; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--text); font-size: 0.82rem; outline: none;
  }
  .tabs {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    width: min(460px, 100%);
  }
  .tabs button {
    border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px;
    font-size: 0.8rem; cursor: pointer; background: #fff; color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .tabs button.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    font-weight: 650; box-shadow: 0 6px 16px rgba(59,130,246,.28);
  }
  .tabs button .n { font-size: 0.7rem; margin-left: 2px; opacity: .9; }
  .progress {
    width: min(460px, 100%); height: 8px; background: #e2e8f0;
    border-radius: 99px; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(15,23,42,.06);
  }
  .progress > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, #60a5fa, #3b82f6 55%, #2563eb);
    width: 0%; transition: width .28s ease; border-radius: 99px;
  }
  .stats {
    width: min(460px, 100%);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.84rem; color: var(--muted); gap: 8px; flex-wrap: wrap;
  }
  .stats .score { color: var(--accent2); font-weight: 700; }
  .toolbar {
    width: min(460px, 100%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .toolbar button, .actions button, .speak-btn, .opt, .chip, .modes button, .nav button {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
    font-size: 0.9rem; cursor: pointer; background: #fff; color: var(--text);
    box-shadow: var(--shadow-sm);
  }
  .toolbar button.primary, .actions .primary, .actions .next, .modes button.active {
    background: linear-gradient(180deg, #4f94ff, var(--accent));
    color: #fff; font-weight: 650; border-color: transparent;
    box-shadow: 0 6px 16px rgba(59,130,246,.28);
  }
  .toolbar button.ghost, .actions .skip {
    background: #fff; border: 1px solid var(--border); color: var(--muted);
  }
  .panel { width: min(460px, 100%); display: none; flex-direction: column; gap: 12px; align-items: center; }
  .panel.show { display: flex; }
  .card {
    width: 100%; background: var(--card); border-radius: 20px;
    padding: 20px 16px 16px; box-shadow: var(--shadow);
    border: 1px solid rgba(226,232,240,.9);
    display: flex; flex-direction: column; gap: 12px;
  }
  .word-card {
    min-height: 220px; align-items: center; justify-content: center;
    text-align: center; cursor: pointer; user-select: none; gap: 0;
  }
  .word-card:active { transform: scale(.98); }
  .word-card .hint { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
  .word-card .main {
    font-size: 2rem; font-weight: 750; word-break: break-word; color: var(--accent2);
  }
  .word-card .zh { font-size: 1.45rem; font-weight: 650; margin-top: 14px; color: var(--text); }
  .word-card .phon { font-size: 1rem; color: var(--muted); margin-top: 8px; }
  .word-card .extra { font-size: 0.9rem; color: #64748b; margin-top: 8px; }
  .word-card.quiz-hide .zh, .word-card.quiz-hide .extra { visibility: hidden; }
  .unit-tag, .tag {
    font-size: 0.7rem; padding: 3px 9px; border-radius: 99px;
    background: #f1f5f9; color: #475569; border: 1px solid var(--border);
  }
  .unit-tag { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; margin-bottom: 8px; display: inline-block; }
  .tag.type { background: var(--accent-soft); color: #1d4ed8; border-color: #bfdbfe; }
  .tag.diff-hard { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .prompt { font-size: 1.06rem; line-height: 1.6; font-weight: 600; color: #0f172a; word-break: break-word; }
  .hint-zh { font-size: 0.85rem; color: var(--muted); line-height: 1.45; }
  .speak-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .speak-btn, .speak-row .speak {
    background: linear-gradient(180deg, #8b5cf6, var(--speak));
    color: #fff; font-weight: 650; border-radius: 999px; padding: 8px 14px;
    border: none; box-shadow: 0 6px 14px rgba(124,58,237,.25);
  }
  .speak-btn.slow, .speak-row .slow {
    background: linear-gradient(180deg, #7c3aed, var(--speak2));
    color: #fff; border: none; border-radius: 999px; padding: 8px 14px;
  }
  label.auto { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .modes button { border-radius: 999px; padding: 8px 14px; }
  .input-wrap input, .input-wrap textarea, .quiz-area input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card2);
    color: var(--text); font-size: 1rem; outline: none; font-family: inherit;
  }
  .input-wrap input:focus, .input-wrap textarea:focus, .quiz-area input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15);
  }
  .input-wrap textarea { min-height: 72px; resize: vertical; }
  .quiz-area { width: 100%; display: none; flex-direction: column; gap: 10px; }
  .quiz-area.show { display: flex; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    text-align: left; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card2);
    line-height: 1.45; box-shadow: none;
  }
  .opt.selected { border-color: var(--accent); background: #eff6ff; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
  .opt.correct { border-color: var(--good); background: var(--good-bg); color: #166534; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); color: #991b1b; }
  .opt:disabled { cursor: default; }
  .reorder {
    display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px;
    padding: 10px; border-radius: 12px; border: 1px dashed #cbd5e1; background: var(--card2);
  }
  .reorder .chip, .pool .chip {
    background: #eff6ff; color: #1d4ed8; border-radius: 999px;
    padding: 8px 12px; font-size: 0.9rem; border: 1px solid #bfdbfe; box-shadow: none;
  }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; }
  .pool .chip { background: #fff; color: var(--text); border-color: var(--border); }
  .feedback { display: none; border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; line-height: 1.55; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--good-bg); border: 1px solid #bbf7d0; color: #166534; }
  .feedback.no { background: var(--bad-bg); border: 1px solid #fecaca; color: #991b1b; }
  .feedback .en { color: #1d4ed8; font-weight: 650; margin-top: 6px; }
  .feedback .zh { color: #475569; margin-top: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .actions button { flex: 1; min-width: 110px; }
  .actions .know { background: var(--good); color: #fff; font-weight: 650; border-color: transparent; }
  .actions .unknow { background: var(--bad); color: #fff; font-weight: 650; border-color: transparent; }
  .nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%; }
  .nav button { border-radius: 999px; }
  .done-box {
    width: 100%; background: var(--card); border-radius: 20px; padding: 26px 18px;
    text-align: center; display: none; box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .done-box.show { display: block; }
  .done-box h2 { margin: 0 0 8px; color: #0f172a; }
  .done-box .big { font-size: 2.1rem; color: var(--accent2); font-weight: 800; margin: 8px 0; }
  .hidden { display: none !important; }
  .multi-blanks { display: flex; flex-direction: column; gap: 8px; }
  .multi-blanks .row { display: flex; align-items: center; gap: 8px; }
  .multi-blanks .row span { min-width: 1.5em; color: var(--accent2); font-weight: 700; }
  .multi-blanks input {
    flex: 1; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 0.95rem;
  }
</style>
</head>
<body>
  <h1>Day1 · U1问候 + U2工作爱好</h1>
  <p class="sub">《英语1B基础模块（第三版）》· 背单词 + 综合挑战</p>

  <div class="voice-status" id="voiceStatus">
    <div class="line">🔊 当前朗读：<b id="voiceName">检测中…</b> <span id="voiceTag">（英式）</span></div>
    <select id="voiceSelect" aria-label="选择朗读声音"></select>
    <div class="tip" id="voiceTip">未检测到英式女声。请用 Chrome，或在系统设置中安装「英语（英国）」语音包。</div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="words" class="active">背单词<span class="n" id="n-words"></span></button>
    <button data-tab="grammar">语法挑战<span class="n" id="n-grammar"></span></button>
    <button data-tab="dialogue">对话补全<span class="n" id="n-dialogue"></span></button>
    <button data-tab="mixed">综合扩展<span class="n" id="n-mixed"></span></button>
    <button data-tab="wrong">错题本<span class="n" id="n-wrong">0</span></button>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div class="stats">
    <span><span id="idx">0</span> / <span id="total">0</span></span>
    <span class="score" id="statsRight">认识 <span id="known">0</span> · 再看 <span id="again">0</span></span>
  </div>

  <!-- ===== 背单词 ===== -->
  <div class="panel show" id="panel-words">
    <div class="modes">
      <button class="active" data-wmode="both" type="button">中英对照</button>
      <button data-wmode="spell" type="button">拼写测试</button>
    </div>
    <div class="card word-card" id="wCard">
      <div class="unit-tag" id="wUnit">U1</div>
      <div class="hint" id="wHint">中英文对照 · 点朗读听发音</div>
      <div class="main" id="wMain">—</div>
      <div class="phon" id="wPhon"></div>
      <div class="zh" id="wZh">—</div>
      <div class="extra" id="wExtra"></div>
    </div>
    <div class="speak-row">
      <button class="speak" id="wSpeak" type="button">🔊 朗读</button>
      <button class="slow" id="wSpeakSlow" type="button">🐢 慢速</button>
      <label class="auto"><input type="checkbox" id="autoSpeak" checked /> 自动朗读</label>
    </div>
    <div class="quiz-area" id="wQuiz">
      <input id="wAnswer" type="text" autocomplete="off" placeholder="输入英文单词…" />
      <div class="actions"><button class="primary" id="wCheck" type="button">检查</button></div>
    </div>
    <div class="actions" id="wRate">
      <button class="unknow" id="wUnknow" type="button">再看一遍</button>
      <button class="know" id="wKnow" type="button">认识了</button>
    </div>
    <div class="nav">
      <button id="wPrev" type="button">上一个</button>
      <button id="wShuffle" type="button">打乱</button>
      <button id="wReset" type="button">重置进度</button>
    </div>
    <div class="done-box" id="wDone">
      <h2>本轮刷完啦 🎉</h2>
      <p class="sub" id="wDoneMsg"></p>
      <div class="toolbar" style="margin-top:14px">
        <button type="button" class="primary" id="wRestart">再刷一轮</button>
      </div>
    </div>
  </div>

  <!-- ===== 测验 ===== -->
  <div class="panel" id="panel-quiz">
    <div class="toolbar">
      <button type="button" id="btnShuffle" class="ghost">🔀 打乱</button>
      <button type="button" id="btnRestart" class="ghost">↺ 重开本模式</button>
      <button type="button" id="btnClearWrong" class="ghost hidden">🗑 清空错题</button>
    </div>
    <div class="card" id="qCard">
      <div class="meta">
        <span class="tag" id="unitTag">U1</span>
        <span class="tag type" id="typeTag">填空</span>
        <span class="tag" id="diffTag">中等</span>
      </div>
      <div class="prompt" id="prompt">加载中…</div>
      <div class="hint-zh" id="hintZh"></div>
      <div class="speak-row" style="justify-content:flex-start">
        <button type="button" class="speak-btn" id="qSpeak">🔊 朗读英文</button>
        <button type="button" class="speak-btn slow" id="qSpeakSlow">🐢 慢速</button>
      </div>
      <div id="answerArea"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions" id="qActions">
        <button type="button" class="primary" id="btnCheck">检查答案</button>
        <button type="button" class="skip" id="btnSkip">跳过</button>
        <button type="button" class="next hidden" id="btnNext">下一题 →</button>
      </div>
    </div>
    <div class="done-box" id="qDone">
      <h2>本模式完成 🎉</h2>
      <div class="big" id="doneScore">0%</div>
      <p class="sub" id="doneMsg"></p>
      <div class="toolbar" style="margin-top:14px;justify-content:center">
        <button type="button" class="primary" id="btnAgain">再做一轮</button>
        <button type="button" class="ghost" id="btnRedoWrong">只做错题</button>
      </div>
    </div>
  </div>

<script>
const WORDS = [
  { unit:"U1", en:"name", phon:"/neɪm/", pos:"n.", zh:"名字" },
  { unit:"U1", en:"call", phon:"/kɔːl/", pos:"v.", zh:"称呼", tip:"Just call me Bill." },
  { unit:"U1", en:"spell", phon:"/spel/", pos:"v.", zh:"拼写", tip:"How do you spell…?" },
  { unit:"U1", en:"friend", phon:"/frend/", pos:"n.", zh:"朋友", tip:"friendly 友好的" },
  { unit:"U1", en:"from", phon:"/frɒm/", pos:"prep.", zh:"来自", tip:"I'm from Beijing." },
  { unit:"U1", en:"glad", phon:"/ɡlæd/", pos:"adj.", zh:"高兴的", tip:"Glad to meet you." },
  { unit:"U1", en:"child", phon:"/tʃaɪld/", pos:"n.", zh:"孩子", tip:"复数 children" },
  { unit:"U1", en:"classmate", phon:"/ˈklɑːsmeɪt/", pos:"n.", zh:"同班同学" },
  { unit:"U1", en:"lovely", phon:"/ˈlʌvli/", pos:"adj.", zh:"可爱的；美丽的" },
  { unit:"U1", en:"pet", phon:"/pet/", pos:"n.", zh:"宠物" },
  { unit:"U1", en:"family name", phon:"", pos:"", zh:"姓" },
  { unit:"U1", en:"full name", phon:"", pos:"", zh:"全名" },
  { unit:"U2", en:"hobby", phon:"/ˈhɒbi/", pos:"n.", zh:"兴趣爱好" },
  { unit:"U2", en:"doctor", phon:"/ˈdɒktə(r)/", pos:"n.", zh:"医生" },
  { unit:"U2", en:"cashier", phon:"/kæˈʃɪə(r)/", pos:"n.", zh:"收银员" },
  { unit:"U2", en:"cycle", phon:"/ˈsaɪkl/", pos:"v.", zh:"骑自行车" },
  { unit:"U2", en:"receptionist", phon:"/rɪˈsepʃənɪst/", pos:"n.", zh:"（宾馆前台）接待员" },
  { unit:"U2", en:"exciting", phon:"/ɪkˈsaɪtɪŋ/", pos:"adj.", zh:"令人激动的" },
  { unit:"U2", en:"boring", phon:"/ˈbɔːrɪŋ/", pos:"adj.", zh:"无聊的" },
  { unit:"U2", en:"stressful", phon:"/ˈstresfl/", pos:"adj.", zh:"压力大的" },
  { unit:"U2", en:"stress", phon:"/stres/", pos:"n.", zh:"精神压力" },
  { unit:"U2", en:"piano", phon:"/piˈænəʊ/", pos:"n.", zh:"钢琴" },
  { unit:"U2", en:"release", phon:"/rɪˈliːs/", pos:"v.", zh:"释放", tip:"release stress" },
  { unit:"U2", en:"interesting", phon:"/ˈɪntrəstɪŋ/", pos:"adj.", zh:"有趣的" },
  { unit:"U2", en:"collect", phon:"/kəˈlekt/", pos:"v.", zh:"收集" },
  { unit:"U2", en:"hate", phon:"/heɪt/", pos:"v.", zh:"厌恶" },
  { unit:"U2", en:"free time", phon:"", pos:"", zh:"业余（课余）时间" },
  { unit:"U2", en:"tour guide", phon:"", pos:"", zh:"导游" },
  { unit:"U2", en:"travel agency", phon:"", pos:"", zh:"旅行社" },
  { unit:"U2", en:"play basketball", phon:"", pos:"", zh:"打篮球" },
];
const BANK = [
  /* ===== 语法挑战：be ===== */
  {
    id:"g01", mode:"grammar", unit:"U1", type:"choose", diff:"中等",
    prompt:"选正确形式：_____ Samuel Anderson. Nice to meet you!",
    speak:"I am Samuel Anderson. Nice to meet you!",
    options:["I am","I is","I are","Me am"],
    answer:"I am",
    explain:"第一人称单数用 am。",
    explainEn:"I am Samuel Anderson. Nice to meet you!",
    explainZh:"我是塞缪尔·安德森。很高兴见到你！"
  },
  {
    id:"g02", mode:"grammar", unit:"U1", type:"choose", diff:"中等",
    prompt:"选正确形式：She _____ from Britain.",
    speak:"She is from Britain.",
    options:["am","is","are","be"],
    answer:"is",
    explain:"第三人称单数 she/he/it 用 is。",
    explainEn:"She is from Britain.",
    explainZh:"她来自英国。"
  },
  {
    id:"g03", mode:"grammar", unit:"U1", type:"fill", diff:"较难",
    prompt:"填空（缩写）：_____ from New York.（I am 的缩写）",
    hint:"提示：I'm / You're / He's…",
    speak:"I'm from New York.",
    answer:"I'm",
    accept:["I'm","I’m","I am"],
    explain:"I am 常缩写为 I'm。口语里很常见。",
    explainEn:"I'm from New York.",
    explainZh:"我来自纽约。"
  },
  {
    id:"g04", mode:"grammar", unit:"U1", type:"rewrite", diff:"较难",
    prompt:"改成否定句：They are classmates.",
    hint:"可用 aren't 或 are not",
    speak:"They aren't classmates.",
    answer:"They aren't classmates.",
    accept:["They aren't classmates.","They aren’t classmates.","They are not classmates.","They're not classmates.","They’re not classmates."],
    explain:"are 的否定：are not = aren't。",
    explainEn:"They aren't classmates. / They are not classmates.",
    explainZh:"他们不是同班同学。"
  },
  {
    id:"g05", mode:"grammar", unit:"U1", type:"rewrite", diff:"较难",
    prompt:"改成一般疑问句：He is a tour guide.",
    hint:"把 be 提前到句首",
    speak:"Is he a tour guide?",
    answer:"Is he a tour guide?",
    accept:["Is he a tour guide?","Is he a tour guide"],
    explain:"be 动词疑问句：把 is/am/are 提到主语前。",
    explainEn:"Is he a tour guide?",
    explainZh:"他是导游吗？"
  },

const LS_KEY = "english1b_day1_wrong_v1";
const $ = (id) => document.getElementById(id);

/* ===== Shared TTS (UK female) ===== */
let enVoice = null;
let voiceMeta = { label: "检测中…", isUK: false, isFemale: false, tier: "none" };

function isFemaleName(name) {
  return /female|woman|girl|emma|serena|kate|karen|susan|zira|hazel|martha|moira|fiona|tessa|victoria|aria|jenny|salli|ivy|joanna|kendra|kimberly|amy|libby|sonia|anya|natalie|google uk english female/i.test(name)
    && !/male|david|daniel|thomas|fred|alex(?!a)|arthur|george|oliver|rishi|ryan|mark|james/i.test(name);
}
function isMaleName(name) {
  return /male|david|daniel|thomas|fred|arthur|george|oliver|rishi|ryan|mark|james|google uk english male/i.test(name);
}
function scoreVoice(v) {
  const lang = (v.lang || "").toLowerCase();
  const name = v.name || "";
  let score = 0;
  const isGB = /en(-|_)gb/.test(lang) || /uk english|british/i.test(name);
  const isUS = /en(-|_)us/.test(lang);
  const isEN = /^en/.test(lang);
  const female = isFemaleName(name);
  const male = isMaleName(name);
  if (/google uk english female/i.test(name)) score += 1000;
  if (isGB && female) score += 800;
  if (isGB && !male) score += 500;
  if (isGB) score += 300;
  if (/emma|serena|kate|libby|sonia|hazel|martha|moira|fiona|tessa/i.test(name) && isGB) score += 120;
  if (!isGB && female && isUS) score += 180;
  if (!isGB && female && isEN) score += 120;
  if (isUS && !male) score += 60;
  if (isEN) score += 20;
  if (/samantha/i.test(name)) score -= 80;
  if (male) score -= 200;
  if (!isEN) score -= 500;
  return score;
}
function pickBestVoice(preferredName) {
  if (!window.speechSynthesis) {
    enVoice = null;
    voiceMeta = { label: "不支持朗读", isUK: false, isFemale: false, tier: "none" };
    return;
  }
  const voices = speechSynthesis.getVoices() || [];
  const enVoices = voices.filter(v => /^en/i.test(v.lang || ""));
  let chosen = null;
  if (preferredName) {
    chosen = enVoices.find(v => v.name === preferredName) || voices.find(v => v.name === preferredName) || null;
  }
  if (!chosen && enVoices.length) {
    chosen = enVoices.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];
  }
  enVoice = chosen;
  if (!chosen) {
    voiceMeta = { label: "未找到英语语音", isUK: false, isFemale: false, tier: "none" };
    return;
  }
  const lang = (chosen.lang || "").toLowerCase();
  const name = chosen.name || "";
  const isUK = /en(-|_)gb/.test(lang) || /uk english|british/i.test(name);
  const female = isFemaleName(name) || (!isMaleName(name) && isUK);
  let tier = "fallback";
  if (isUK && female) tier = "uk-female";
  else if (isUK) tier = "uk";
  else if (female) tier = "us-female";
  voiceMeta = { label: name, isUK, isFemale: !!female, tier };
}
function refreshVoiceUI() {
  const nameEl = $("voiceName");
  const tagEl = $("voiceTag");
  const tipEl = $("voiceTip");
  const sel = $("voiceSelect");
  if (!nameEl) return;
  nameEl.textContent = voiceMeta.label || "未知";
  if (voiceMeta.tier === "uk-female") tagEl.textContent = "（英式女声）";
  else if (voiceMeta.tier === "uk") tagEl.textContent = "（英式）";
  else if (voiceMeta.tier === "us-female") tagEl.textContent = "（美式女声·后备）";
  else if (voiceMeta.tier === "fallback") tagEl.textContent = "（后备）";
  else tagEl.textContent = "";
  const needTip = voiceMeta.tier !== "uk-female";
  tipEl.classList.toggle("show", needTip);
  if (needTip && voiceMeta.tier === "none") {
    tipEl.textContent = "未检测到可用英语语音。请用 Chrome，或在系统设置中安装「英语（英国）」语音包。";
  } else if (needTip) {
    tipEl.textContent = "未检测到英式女声，已用后备音色。请用 Chrome，或在系统安装英式语音包以获得最佳效果。";
  }
  if (sel && !sel.dataset.filled) {
    const voices = (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang || ""));
    voices.sort((a, b) => scoreVoice(b) - scoreVoice(a));
    sel.innerHTML = "";
    if (!voices.length) {
      const opt = document.createElement("option");
      opt.value = ""; opt.textContent = "无可用英语语音";
      sel.appendChild(opt);
    } else {
      voices.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        const uk = /en(-|_)gb/i.test(v.lang) || /uk english|british/i.test(v.name);
        const mark = uk ? "🇬🇧" : (/en(-|_)us/i.test(v.lang) ? "🇺🇸" : "🌐");
        opt.textContent = mark + " " + v.name + " (" + v.lang + ")";
        sel.appendChild(opt);
      });
    }
    sel.dataset.filled = "1";
  }
  if (sel && enVoice) sel.value = enVoice.name;
}
function initVoices() {
  pickBestVoice();
  const sel = $("voiceSelect");
  if (sel) sel.dataset.filled = "";
  refreshVoiceUI();
}
function speakText(text, rate) {
  if (!text || !window.speechSynthesis) {
    alert("当前浏览器不支持朗读，请用 Chrome / Edge 打开。");
    return;

  if (!enVoice) initVoices();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  u.rate = rate || 0.93;
  u.pitch = 1.05;
  if (enVoice) u.voice = enVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
initVoices();
if (typeof speechSynthesis !== "undefined" && speechSynthesis.onvoiceschanged !== undefined) {

}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let quizMode = "grammar";

let correct = 0;
let wrong = 0;

let selectedOpt = null;
let reorderPicked = [];
let sessionWrongIds = new Set();

function loadWrongBook() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveWrongBook(arr) {
  localStorage.setItem(LS_KEY, JSON.stringify(arr));

}
function addWrong(q) {
  const book = loadWrongBook();
  if (!book.find(x => x.id === q.id)) {
    book.push({ id: q.id, prompt: q.prompt, answer: Array.isArray(q.answer) ? q.answer.join(" / ") : q.answer, explainEn: q.explainEn, explainZh: q.explainZh, ts: Date.now() });
    saveWrongBook(book);
  }
  sessionWrongIds.add(q.id);
}
function removeWrong(id) { saveWrongBook(loadWrongBook().filter(x => x.id !== id)); }
function updateTabCounts() {
  $("n-words").textContent = WORDS.length;
  $("n-grammar").textContent = BANK.filter(q => q.mode === "grammar").length;
  $("n-dialogue").textContent = BANK.filter(q => q.mode === "dialogue").length;
  $("n-mixed").textContent = BANK.filter(q => q.mode === "mixed").length;
  $("n-wrong").textContent = loadWrongBook().length;
}
function typeLabel(t) {
  return ({ choose:"选择", fill:"填空", rewrite:"改写", error:"改错", translate:"翻译", multi:"多空填空", reorder:"排序" })[t] || t;
}
function norm(s) {
  return String(s || "").trim().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, " ").replace(/[.?!。？！]+$/g, "").toLowerCase();
}
function matchOne(user, answer, accept) {
  const u = norm(user);
  return [answer].concat(accept || []).map(norm).some(c => c === u);
}
function matchMulti(users, answers, acceptLists) {
  if (users.length !== answers.length) return false;
  return answers.every((a, i) => matchOne(users[i], a, (acceptLists && acceptLists[i]) || []));
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function buildQueue(m, onlyIds) {
  let list;
  if (m === "wrong") {
    const ids = onlyIds || loadWrongBook().map(x => x.id);
    list = BANK.filter(q => ids.includes(q.id));
  } else {
    list = BANK.filter(q => q.mode === m);
    if (onlyIds) list = list.filter(q => onlyIds.includes(q.id));
  }
  return shuffle(list.slice());
}
function startQuizMode(m, onlyIds) {

function qUpdateStats() {

function renderAnswerArea(q) {

  if (q.type === "choose") {

  } else if (q.type === "multi") {
    const wrap = document.createElement("div");

      chip.type = "button"; chip.className = "chip"; chip.textContent = p;
      chip.onclick = () => {
        if (answered) return;
        reorderPicked.push(p); chip.remove();
        const c2 = document.createElement("button");
        c2.type = "button"; c2.className = "chip"; c2.textContent = p;
        c2.onclick = () => {
          if (answered) return;

          if (ix >= 0) reorderPicked.splice(ix, 1);
          c2.remove(); pool.appendChild(chip);

        slot.appendChild(c2);

function getUserAnswer(q) {
  if (q.type === "choose") return selectedOpt;
  if (q.type === "multi") return [...$("answerArea").querySelectorAll("input")].map(i => i.value);
  if (q.type === "reorder") return reorderPicked.slice();

function isCorrect(q, user) {

}
function lockChoices(q, ok, user) {
  if (q.type !== "choose") return;
  $("answerArea").querySelectorAll(".opt").forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === q.answer) btn.classList.add("correct");
    if (!ok && btn.textContent === user) btn.classList.add("wrong");
  });
}
function showFeedback(q, ok) {
  const fb = $("feedback");
  fb.className = "feedback show " + (ok ? "ok" : "no");
  const ansText = Array.isArray(q.answer) ? q.answer.join("  /  ") : q.answer;
  fb.innerHTML =
    (ok ? "✅ 正确！" : "❌ 不对。") +
    "<div style='margin-top:6px'>" + q.explain + "</div>" +
    "<div class='en'>🇬🇧 " + escapeHtml(q.explainEn) + "</div>" +
    "<div class='zh'>🇨🇳 " + escapeHtml(q.explainZh) + "</div>" +
    (ok ? "" : "<div style='margin-top:6px;color:#991b1b'>参考答案：<b>" + escapeHtml(ansText) + "</b></div>");
}
function checkAnswer() {
  if (answered || qi >= queue.length) return;
  const q = queue[qi];
  const user = getUserAnswer(q);
  if (q.type === "choose" && user == null) { alert("请先选择一个选项"); return; }
  if (q.type === "multi" && user.some(u => !String(u).trim())) { alert("请填完所有空"); return; }
  if (q.type === "reorder" && user.length !== q.answer.length) { alert("请把所有短语排入顺序"); return; }
  if ((q.type === "fill" || q.type === "rewrite" || q.type === "error" || q.type === "translate") && !String(user).trim()) {
    alert("请先输入答案"); return;
  }
  const ok = isCorrect(q, user);
  answered = true;
  if (ok) { correct++; if (quizMode === "wrong") removeWrong(q.id); }
  else { wrong++; addWrong(q); }
  lockChoices(q, ok, user);
  showFeedback(q, ok);
  $("btnCheck").classList.add("hidden");
  $("btnSkip").classList.add("hidden");
  $("btnNext").classList.remove("hidden");
  qUpdateStats();
}
function skipQ() {
  if (answered || qi >= queue.length) return;
  const q = queue[qi];
  answered = true; wrong++; addWrong(q);
  showFeedback(q, false); lockChoices(q, false, null);
  $("btnCheck").classList.add("hidden");
  $("btnSkip").classList.add("hidden");
  $("btnNext").classList.remove("hidden");
  qUpdateStats();
}
function nextQ() { qi++; qRender(); }
function showDone() {
  $("qCard").classList.add("hidden");
  $("qDone").classList.add("show");
  const total = correct + wrong;
  const pct = total ? Math.round(correct / total * 100) : 0;
  $("doneScore").textContent = pct + "%";
  $("doneMsg").textContent = `正确 ${correct} · 错误 ${wrong} · 共 ${total} 题。错题已自动收入错题本。`;
  $("bar").style.width = "100%";
  updateTabCounts();
}
$("btnCheck").onclick = checkAnswer;
$("btnSkip").onclick = skipQ;
$("btnNext").onclick = nextQ;
$("btnShuffle").onclick = () => startQuizMode(quizMode);
$("btnRestart").onclick = () => startQuizMode(quizMode);
$("btnAgain").onclick = () => startQuizMode(quizMode);
$("btnRedoWrong").onclick = () => {
  const ids = [...sessionWrongIds];
  if (!ids.length) { setTab("wrong"); return; }
  quizMode = "wrong";
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === "wrong"));
  startQuizMode("wrong", ids);
};
$("btnClearWrong").onclick = () => {
  if (confirm("确定清空错题本？")) { saveWrongBook([]); startQuizMode("wrong"); }
};
$("qSpeak").onclick = () => { if (qi < queue.length) speakText(queue[qi].speak || queue[qi].explainEn, 0.93); };
$("qSpeakSlow").onclick = () => { if (qi < queue.length) speakText(queue[qi].speak || queue[qi].explainEn, 0.65); };

updateTabCounts();
shuffle(wOrder);
wRender();
</script>
</body>
</html>
